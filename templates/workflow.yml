# Keeps this project's dependencies on the latest releases, Dependabot-style,
# and merges the update PR automatically when it is safe to.
# Generated by `agent-versions init` - https://github.com/AndrewTtofi/versions
#
#   update     finds new releases (older than --min-age days), rewrites manifests,
#              refreshes lockfiles with install scripts disabled, opens one PR
#   verify     installs and runs VERIFY on the PR branch with a READ-ONLY token,
#              so a compromised package can't push code or read secrets
#   automerge  merges only if verify passed and the largest change is within
#              AUTOMERGE; anything bigger is labelled and left for a human
#
# One-time setup:
#   Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests"
#   Settings -> General -> "Allow auto-merge"
#   Optional: a secret AGENT_VERSIONS_TOKEN (fine-grained PAT or GitHub App token
#   with contents + pull-requests write). With it, your other CI runs on the PR
#   and the merge triggers your push workflows (GITHUB_TOKEN events don't).
#
# Every third-party action is pinned to a commit SHA.
name: agent-versions

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch:

permissions: {}

env:
  AUTOMERGE: __AUTOMERGE__ # none | patch | minor | major: largest change merged without a human
  VERIFY: __VERIFY__ # install + test command run before merging ('' = rely on required status checks)

concurrency:
  group: agent-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
      level: ${{ steps.versions.outputs.level }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: AndrewTtofi/versions@__REF__
        id: versions
        with:
          args: __ARGS__
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          token: ${{ secrets.AGENT_VERSIONS_TOKEN || github.token }}
          branch: agent-versions/updates
          delete-branch: true
          commit-message: 'chore(deps): update dependencies to latest releases'
          title: 'chore(deps): update dependencies to latest releases'
          body: ${{ steps.versions.outputs.report }}
          labels: dependencies

  verify:
    needs: update
    if: needs.update.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent-versions/updates
          persist-credentials: false
      - name: Install and test (read-only token, no secrets)
        run: |
          if [ -z "$VERIFY" ]; then echo "VERIFY is empty; relying on required status checks."; exit 0; fi
          bash -eo pipefail -c "$VERIFY"

  automerge:
    needs: [update, verify]
    if: needs.update.outputs.pr != '' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge if within policy
        env:
          GH_TOKEN: ${{ secrets.AGENT_VERSIONS_TOKEN || github.token }}
          PR: ${{ needs.update.outputs.pr }}
          LEVEL: ${{ needs.update.outputs.level }}
        run: |
          rank() { case "$1" in patch) echo 1;; minor) echo 2;; major) echo 3;; *) echo 0;; esac; }
          if [ "$(rank "$AUTOMERGE")" -eq 0 ] || [ "$(rank "$LEVEL")" -gt "$(rank "$AUTOMERGE")" ]; then
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-review || true
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Contains a **$LEVEL** update, above the auto-merge policy (\`$AUTOMERGE\`). Please review." || true
            exit 0
          fi
          # Prefer native auto-merge: it waits for required checks and reviews.
          if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --auto; then exit 0; fi
          if [ -n "$VERIFY" ]; then
            # No branch protection / auto-merge disabled: verify already passed.
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "Not merged automatically: enable auto-merge with required status checks, or set VERIFY in .github/workflows/agent-versions.yml." || true
          fi
