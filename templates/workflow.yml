# Keeps this project's dependencies on the latest releases, Dependabot-style:
# checks on a schedule and opens (or refreshes) a single pull request.
# Generated by `agent-versions init` - https://github.com/AndrewTtofi/versions
#
# Requires: Settings -> Actions -> General -> "Allow GitHub Actions to create
# and approve pull requests". Every action is pinned to a commit SHA.
name: agent-versions

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: AndrewTtofi/versions@__REF__
        id: versions
        with:
          args: __ARGS__
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: agent-versions/updates
          delete-branch: true
          commit-message: 'chore(deps): update dependencies to latest releases'
          title: 'chore(deps): update dependencies to latest releases'
          body: ${{ steps.versions.outputs.report }}
          labels: dependencies
