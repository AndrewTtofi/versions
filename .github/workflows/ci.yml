name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/agent-versions.js --help
      - name: No runtime dependencies allowed
        run: node -e 'const p=require("./package.json"); if (Object.keys({...p.dependencies,...p.optionalDependencies}).length) { console.error("Runtime dependencies are not allowed (supply-chain policy)"); process.exit(1) }'
