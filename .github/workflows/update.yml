# Publishes the live feed to the `data` branch every 4 hours. `main` is
# protected and never written by automation; `data` only ever holds
# latest.json and VERSIONS.md.
name: update-snapshot

on:
  schedule:
    - cron: '17 */4 * * *' # every 4 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.json, src/**, scripts/collect.js]

permissions: {}

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  collect:
    # Never run on forks: they have no business writing the published feed.
    if: github.repository == 'AndrewTtofi/versions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Start from the currently published feed
        run: |
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:latest.json > data/latest.json
          fi
      - run: node scripts/collect.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate output
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("data/latest.json", "utf8"));
            if (!s.packages || !s.tools || Object.keys(s.tools).length === 0) throw new Error("empty snapshot");
          '
      - name: Publish to the data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          feed="$RUNNER_TEMP/feed"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q --depth=1 origin data
            git worktree add -q --detach "$feed" FETCH_HEAD
          else
            git worktree add -q --detach "$feed"
            git -C "$feed" switch -q --orphan data
          fi
          cp data/latest.json VERSIONS.md "$feed/"
          cd "$feed"
          git add latest.json VERSIONS.md
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "chore(data): refresh latest versions"
          git push -q origin HEAD:refs/heads/data
