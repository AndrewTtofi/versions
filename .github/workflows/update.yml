# Keeps data/latest.json and VERSIONS.md current. Anyone reading the snapshot
# (CLI --snapshot/--tracked, MCP tools, the plugin) gets these values.
name: update-snapshot

on:
  schedule:
    - cron: '17 */4 * * *' # every 4 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: [sources.json, src/**, scripts/collect.js]

permissions: {}

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  collect:
    # Never run on forks: they have no business writing the published feed.
    if: github.repository == 'AndrewTtofi/versions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/collect.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Refuse to publish anything but data
        run: |
          changed=$(git status --porcelain | awk '{print $2}' | grep -v -E '^(data/latest\.json|VERSIONS\.md)$' || true)
          if [ -n "$changed" ]; then echo "Unexpected changes: $changed"; exit 1; fi
          node -e 'JSON.parse(require("fs").readFileSync("data/latest.json","utf8"))'
      - name: Commit if changed
        run: |
          if git diff --quiet -- data VERSIONS.md; then echo "No changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json VERSIONS.md
          git commit -m "chore(data): refresh latest versions"
          git pull --rebase
          git push
