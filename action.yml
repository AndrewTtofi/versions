name: agent-versions
description: Update project dependencies to the latest releases (npm, PyPI, Cargo, Go). Pair with a PR action for Dependabot-style updates.
author: AndrewTtofi
branding:
  icon: arrow-up-circle
  color: green
inputs:
  directory:
    description: Project directory to update
    default: '.'
  args:
    description: Extra CLI flags, e.g. "--no-major --exclude react*"
    default: ''
  mode:
    description: '"update" rewrites manifests; "check" only reports (fails when outdated)'
    default: update
  lockfiles:
    description: Refresh lockfiles next to updated manifests (install scripts disabled)
    default: 'true'
outputs:
  report:
    description: Markdown summary of the changes
    value: ${{ steps.run.outputs.report }}
  outdated:
    description: Number of dependencies updated (or outdated, in check mode)
    value: ${{ steps.run.outputs.outdated }}
  level:
    description: Largest change applied - none, patch, minor or major
    value: ${{ steps.run.outputs.level }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - id: run
      shell: bash
      working-directory: ${{ inputs.directory }}
      # Inputs go through env vars, never ${{ }} inside the script (no injection).
      env:
        MODE: ${{ inputs.mode }}
        ARGS: ${{ inputs.args }}
        ACTION_PATH: ${{ github.action_path }}
        LOCKFILES: ${{ inputs.lockfiles }}
      run: |
        set -f  # ARGS is split into words but never glob-expanded
        case "$MODE" in update|check) ;; *) echo "mode must be update or check"; exit 2 ;; esac
        FLAGS=""; [ "$MODE" = "check" ] && FLAGS="--fail"
        # shellcheck disable=SC2086
        node "$ACTION_PATH/bin/agent-versions.js" "$MODE" . --json $FLAGS $ARGS > "$RUNNER_TEMP/agent-versions.json" || status=$?
        node "$ACTION_PATH/scripts/action-report.js" "$RUNNER_TEMP/agent-versions.json" >> "$GITHUB_OUTPUT"
        if [ "${status:-0}" = "2" ]; then exit 2; fi
        if [ "$MODE" = "update" ] && [ "$LOCKFILES" = "true" ]; then
          node "$ACTION_PATH/scripts/refresh-lockfiles.js" "$RUNNER_TEMP/agent-versions.json" . || true
        fi
        if [ "$MODE" = "check" ] && [ "${status:-0}" != "0" ]; then exit "$status"; fi
